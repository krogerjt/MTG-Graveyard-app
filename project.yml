name: GraveyardTracker
options:
  bundleIdPrefix: com.graveyardtracker
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: 2
    MARKETING_VERSION: 1.0
targets:
  GraveyardTracker:
    type: application
    platform: iOS
    sources: [GraveyardTracker]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.graveyardtracker.app
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: L67J56VPBG
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Graveyard Tracker
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
    info:
      path: GraveyardTracker/Info.plist
      properties:
        CFBundleURLTypes: []
        ITSAppUsesNonExemptEncryption: false
  GraveyardTrackerTests:
    type: bundle.unit-test
    platform: iOS
    sources: [GraveyardTrackerTests]
    dependencies:
      - target: GraveyardTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.graveyardtracker.tests
        GENERATE_INFOPLIST_FILE: YES
  GraveyardTrackerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [GraveyardTrackerUITests]
    dependencies:
      - target: GraveyardTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.graveyardtracker.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  GraveyardTracker:
    build:
      targets:
        GraveyardTracker: all
    test:
      config: Debug
      targets:
        - GraveyardTrackerTests
        - GraveyardTrackerUITests
