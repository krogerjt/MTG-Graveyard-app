name: GraveyardTracker
options:
  bundleIdPrefix: com.graveyardtracker
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0
targets:
  GraveyardTracker:
    type: application
    platform: iOS
    sources: [GraveyardTracker]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.graveyardtracker.app
        INFOPLIST_KEY_CFBundleDisplayName: Graveyard Tracker
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
    info:
      path: GraveyardTracker/Info.plist
      properties:
        CFBundleURLTypes: []
  GraveyardTrackerTests:
    type: bundle.unit-test
    platform: iOS
    sources: [GraveyardTrackerTests]
    dependencies:
      - target: GraveyardTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.graveyardtracker.tests
        GENERATE_INFOPLIST_FILE: YES
